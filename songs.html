<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Love Songs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Pacifico&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="days-counter" aria-live="polite">
        <span class="days-label">Together for</span>
        <strong id="days-count">26</strong>
        <span class="days-label">days</span>
      </div>

      <main class="container main-content">
        <section class="intro">
          <p class="kicker">Our song collection</p>
          <h1>For us</h1>
          <p class="subtitle">
            A little space for all the songs that remind me of us.
          </p>
        </section>

        <section class="song-library">
          <div class="song-box">
            <h2>Song 1</h2>
            <p>Upload your next favorite song here.</p>
          </div>
          <div class="song-box">
            <h2>Song 2</h2>
            <p>Keep adding more memories, one song at a time.</p>
          </div>
          <div class="song-box">
            <h2>Song 3</h2>
            <p>This page is ready for your future playlist.</p>
          </div>
        </section>
      </main>
    </div>

    <nav class="bottom-nav" aria-label="Main navigation">
      <a href="index.html" class="nav-link">Home</a>
      <a href="songs.html" class="nav-link active">Songs</a>
    </nav>

    <script src="script.js"></script>
