<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>For My Love</title>
    <meta
      name="description"
      content="A cute little love page with five flip envelopes for my boyfriend."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Pacifico&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="top-placeholder">
        <div class="container top-inner">
          <p class="mini-tag">My favorite person</p>
          <div class="placeholder-box" aria-label="Space for future content">
            <span>Space for your future content</span>
          </div>
        </div>
      </header>

      <main class="container main-content">
        <section class="intro">
          <p class="kicker">For my boyfriend</p>
          <h1>Open my little love letters</h1>
          <p class="subtitle">
            Five tiny notes, each one wrapped with a little bit of my heart.
          </p>
        </section>

        <section class="envelope-grid" aria-label="Love notes">
          <button class="envelope-card" type="button" aria-label="Open envelope 1">
            <div class="envelope-inner">
              <div class="envelope-face envelope-front">
                <div class="front-top"></div>
                <div class="stamp">❤</div>
                <div class="envelope-label">For you</div>
              </div>
              <div class="envelope-face envelope-back">
                <div class="note">
                  <span>Letter 1</span>
                  <h2>Hi love,</h2>
                  <p>You are my favorite person and my sweetest comfort.</p>
                </div>
              </div>
            </div>
          </button>

          <button class="envelope-card" type="button" aria-label="Open envelope 2">
            <div class="envelope-inner">
              <div class="envelope-face envelope-front">
                <div class="front-top"></div>
                <div class="stamp">♥</div>
                <div class="envelope-label">Smile</div>
              </div>
              <div class="envelope-face envelope-back">
                <div class="note">
                  <span>Letter 2</span>
                  <h2>Always</h2>
                  <p>My favorite thing is seeing you smile, even for a second.</p>
                </div>
              </div>
            </div>
          </button>

          <button class="envelope-card" type="button" aria-label="Open envelope 3">
            <div class="envelope-inner">
              <div class="envelope-face envelope-front">
                <div class="front-top"></div>
                <div class="stamp">♡</div>
                <div class="envelope-label">Us</div>
              </div>
              <div class="envelope-face envelope-back">
                <div class="note">
                  <span>Letter 3</span>
                  <h2>Our story</h2>
                  <p>Every day with you feels warm, beautiful, and so full of love.</p>
                </div>
              </div>
            </div>
          </button>

          <button class="envelope-card" type="button" aria-label="Open envelope 4">
            <div class="envelope-inner">
              <div class="envelope-face envelope-front">
                <div class="front-top"></div>
                <div class="stamp">❤</div>
                <div class="envelope-label">Dream</div>
              </div>
              <div class="envelope-face envelope-back">
                <div class="note">
                  <span>Letter 4</span>
                  <h2>Forever</h2>
                  <p>My dream is to keep making memories with you, always.</p>
                </div>
              </div>
            </div>
          </button>

          <button class="envelope-card" type="button" aria-label="Open envelope 5">
            <div class="envelope-inner">
              <div class="envelope-face envelope-front">
                <div class="front-top"></div>
                <div class="stamp">♥</div>
                <div class="envelope-label">Love</div>
              </div>
              <div class="envelope-face envelope-back">
                <div class="note">
                  <span>Letter 5</span>
                  <h2>You are home</h2>
                  <p>And I am so lucky to love you, now and always.</p>
                </div>
              </div>
            </div>
          </button>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
