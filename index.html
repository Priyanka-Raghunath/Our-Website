<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>For My Love</title>
    <meta
      name="description"
      content="A cute little love page with five flip envelopes for my boyfriend."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Pacifico&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="days-counter" aria-live="polite">
        <span>Together for</span>
        <strong id="days-count">25</strong>
        <span>days</span>
      </div>

      <main class="container main-content">
        <section class="intro">
          <p class="kicker">For my boyfriend</p>
          <h1>Open my little love letters</h1>
          <p class="subtitle">
            Three tiny notes, each one wrapped with a little bit of my heart.
          </p>
        </section>

        <section class="envelope-grid" aria-label="Love notes">
          <button class="envelope-card" type="button" aria-label="Open envelope 1">
            <div class="envelope-inner">
              <div class="envelope-face envelope-front">
                <div class="front-top"></div>
                <div class="stamp">❤</div>
                <div class="envelope-label">Warmth</div>
              </div>
              <div class="envelope-face envelope-back">
                <div class="note">
                  <span>Letter 1</span>
                  <h2>Comfort</h2>
                  <p>The comfort, the warmth, the happiness you give is what I've been wishing for!!</p>
                </div>
              </div>
            </div>
          </button>

          <button class="envelope-card" type="button" aria-label="Open envelope 2">
            <div class="envelope-inner">
              <div class="envelope-face envelope-front">
                <div class="front-top"></div>
                <div class="stamp">♥</div>
                <div class="envelope-label">Smile</div>
              </div>
              <div class="envelope-face envelope-back">
                <div class="note">
                  <span>Letter 2</span>
                  <h2>Favourite</h2>
                  <p>My favourite thing is to see you smile, even for a second. You know what else is my favourite? .... YOUUU</p>
                </div>
              </div>
            </div>
          </button>

          <button class="envelope-card" type="button" aria-label="Open envelope 3">
            <div class="envelope-inner">
              <div class="envelope-face envelope-front">
                <div class="front-top"></div>
                <div class="stamp">♡</div>
                <div class="envelope-label">Love</div>
              </div>
              <div class="envelope-face envelope-back">
                <div class="note">
                  <span>Letter 3</span>
                  <h2>Go-to person</h2>
                  <p>You are my best friend, boy friend, partner in crisis, companion, support, my love and everything!!</p>
                </div>
              </div>
            </div>
          </button>
        </section>

        <section class="home-story" id="milestones" aria-label="Our milestones">
          <div class="home-story-header">
            <p>Our little story</p>
            <h2>Milestones</h2>
          </div>

          <div class="heart-journey">
            <div class="story-list" aria-label="Relationship milestones">
              <button class="story-item" type="button" data-title="Our First Conversation" data-message="I remember clearly how you tried to strike conversation this day. We had our cute little introductions. Coincidently our seats were beside each other on the Alcazar show. I really wished aunties weren't sitting beside me that day, hehe.">
                <div class="story-date">13th Aug</div>
                <div class="story-dot" aria-hidden="true"></div>
                <div class="story-card">
                  <h2>Our First Conversation</h2>
                </div>
              </button>

              <button class="story-item" type="button" data-title="Our First Kiss" data-message="Totally loved the conversation that lead to it. Never imagined something like this could happen in such a way!! That kiss, that day felt very different. I never told you but, I had already started to feel something for you. I had already grown closer to you, I already got attached my love!">
                <div class="story-date">14th Aug</div>
                <div class="story-dot" aria-hidden="true"></div>
                <div class="story-card">
                  <h2>Our First Kiss</h2>
                </div>
              </button>

              <button class="story-item" type="button" data-title="Our First “I Like You”" data-message="Imagine the amount of butterflies I got when you said that on bed while cuddling. That tight hug, that feeling of belongingness... omg... I barely managed to act normal.. How could I? After all, it was you">
                <div class="story-date">16th Aug</div>
                <div class="story-dot" aria-hidden="true"></div>
                <div class="story-card">
                  <h2>Our First “I Like You”</h2>
                </div>
              </button>

              <button class="story-item" type="button" data-title="Our First “I Love You”" data-message="Who said 'I love you' first?

Maau
Kanna">
                <div class="story-date">6th Sep</div>
                <div class="story-dot" aria-hidden="true"></div>
                <div class="story-card">
                  <h2>Our First “I Love You”</h2>
                </div>
              </button>

              <button class="story-item" type="button" data-title="Our Relationship Day" data-message="After really putting thoughts into it, we finally made it!! Thanks for being the way you are kanna!! You make me feel so comfortable and safe!! None like you...&#10;I'm super proud of you.. have huge respect for you.. I'm so happy you are doing so well and will always wish you keep doing better and better. You have no idea how much I love you (I love you more, hehe). - Your fav Maau">
                <div class="story-date">7th Sep</div>
                <div class="story-dot" aria-hidden="true"></div>
                <div class="story-card">
                  <h2>Our Relationship Day</h2>
                </div>
              </button>
            </div>
          </div>
        </section>

      </main>
    </div>

    <div class="story-modal" id="storyModal" aria-hidden="true">
      <div class="story-modal-card" role="dialog" aria-modal="true" aria-labelledby="storyModalTitle">
        <button class="story-modal-close" type="button" aria-label="Close popup">&times;</button>
        <p class="story-modal-date" id="storyModalDate">Memory</p>
        <h3 id="storyModalTitle">Our memory</h3>
        <p class="story-modal-text" id="storyModalText"></p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
